name: Scrape PSA Tournaments

on:
  schedule:
    - cron: "0 3 * * 1"  # Every Monday at 3am UTC
  workflow_dispatch:      # Also triggerable manually from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run PSA scraper
        run: python scripts/scrape_psa.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Report
        run: echo "PSA scrape complete at $(date -u)"
