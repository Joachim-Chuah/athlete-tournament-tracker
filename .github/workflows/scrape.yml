name: Scrape PSA Tournaments

on:
  schedule:
    - cron: "0 3 * * 1"  # Every Monday at 3am UTC
  workflow_dispatch:      # Also triggerable manually from GitHub UI

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run PSA scraper
        run: node scripts/scrape-psa.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Report
        run: echo "PSA scrape complete at $(date -u)"
