name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests + coverage
        run: npm run test:coverage

      - name: Coverage threshold check
        run: |
          node -e "
            const fs = require('fs');
            const data = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const t = data.total;
            const pct = (t.lines.covered / t.lines.total) * 100;
            console.log('Coverage: ' + pct.toFixed(2) + '%');
            if (pct < 80) {
              console.error('Coverage ' + pct.toFixed(2) + '% is below 80% threshold');
              process.exit(1);
            }
            console.log('Coverage check passed');
          "

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const summary = JSON.parse(fs.readFileSync('coverage/coverage-summary.json', 'utf8'));
            const t = summary.total;
            const pct = n => n.total > 0 ? ((n.covered / n.total) * 100).toFixed(1) + '%' : 'N/A';
            const body = [
              '## Coverage Report',
              `| Metric | Coverage |`,
              `|--------|----------|`,
              `| Lines | ${pct(t.lines)} |`,
              `| Functions | ${pct(t.functions)} |`,
              `| Branches | ${pct(t.branches)} |`,
              `| Statements | ${pct(t.statements)} |`,
            ].join('\n');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Build check
        run: npm run build
        env:
          DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
          OPEN_EXCHANGE_RATES_KEY: placeholder
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder
