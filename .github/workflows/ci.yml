name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build check
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:5000
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  backend:
    name: Backend (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests + coverage
        run: |
          pytest backend/tests/ -v \
            --cov=backend/utils \
            --cov=backend/routes \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under=80
        env:
          # Stub vars so app.py imports without error (no real DB or auth needed)
          SUPABASE_JWKS_URL: https://placeholder.supabase.co/auth/v1/.well-known/jwks.json

      - name: Post coverage comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const { execSync } = require('child_process');
            const out = execSync(
              'pytest backend/tests/ --cov=backend/utils --cov=backend/routes --cov-report=term-missing -q 2>&1 || true',
              { env: { ...process.env, SUPABASE_JWKS_URL: 'https://placeholder.supabase.co/auth/v1/.well-known/jwks.json' } }
            ).toString();
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `## Python Coverage\n\`\`\`\n${out.slice(-3000)}\n\`\`\``,
            });
